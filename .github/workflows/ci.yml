name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go test ./...
      - run: docker build -t athena-api:test .

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build -t athena-worker:test .
  smoke:
    needs: [backend, worker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Nyalakan stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API hidup dan DB nyambung
        run: |
          curl -fsS http://localhost:8080/v1/health | grep -q '"database":"UP"'
      - name: Log kalau gagal
        if: failure()
        run: docker compose logs --no-color
      - name: Bersih-bersih
        if: always()
        run: docker compose down -v
